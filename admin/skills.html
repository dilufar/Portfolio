<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Skills Management — Admin</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      :root {
        --ink: #0a0a0a;
        --ivory: #f5f3ef;
        --glass: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #c9b99a;
        --muted: rgba(255, 255, 255, 0.35);
        --danger: #b87878;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--ink);
        color: var(--ivory);
        font-family: "DM Sans", sans-serif;
        font-weight: 300;
        min-height: 100vh;
      }

      .admin-wrapper {
        min-height: 100vh;
        display: flex;
      }

      /* SIDEBAR */

      .sidebar {
        width: 260px;
        min-height: 100vh;
        border-right: 1px solid var(--border);
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(20px);
        padding: 2rem 1.5rem;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
      }

      .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--ivory);
        text-decoration: none;
        display: block;
        padding: 0.5rem;
      }

      .logo span {
        color: var(--accent);
      }

      .admin-label {
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        padding: 0 0.5rem;
        margin: 0.5rem 0 2rem;
      }

      .sidebar-menu {
        list-style: none;
      }

      .sidebar-menu li {
        margin-bottom: 0.5rem;
      }

      .sidebar-menu a {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        padding: 0.9rem 1rem;
        text-decoration: none;
        color: var(--muted);
        border: 1px solid transparent;
        transition: 0.3s;
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .sidebar-menu a i {
        width: 18px;
        text-align: center;
        color: var(--accent);
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        color: var(--ivory);
        border-color: var(--border);
        background: var(--glass);
      }

      .sidebar-bottom {
        position: absolute;
        left: 1.5rem;
        right: 1.5rem;
        bottom: 2rem;
      }

      .back-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        color: var(--muted);
        text-decoration: none;
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: 0.3s;
      }

      .back-btn:hover {
        color: var(--ivory);
        border-color: rgba(201, 185, 154, 0.4);
      }

      /* MAIN */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
        padding: 3rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.5rem;
        margin-bottom: 2rem;
      }

      .topbar-label {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }

      .topbar-title {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 300;
      }

      .topbar-title em {
        color: var(--accent);
      }

      /* CONTENT */

      .content-grid {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 1.5rem;
      }

      .panel {
        border: 1px solid var(--border);
        background: var(--glass);
        padding: 2rem;
      }

      .panel-title {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.8rem;
        font-weight: 400;
        margin-bottom: 1.5rem;
      }

      /* FORM */

      .form-group {
        margin-bottom: 1.2rem;
      }

      .panel-label {
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--accent);
        margin-bottom: 0.4rem;
        display: block;
      }

      input,
      select {
        width: 100%;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid var(--border);
        color: var(--ivory);
        padding: 0.9rem 1rem;
        outline: none;
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
      }

      select option {
        background: var(--ink);
        color: var(--ivory);
      }

      input:focus,
      select:focus {
        border-color: rgba(201, 185, 154, 0.5);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.2);
      }

      .form-buttons {
        display: flex;
        gap: 0.7rem;
        margin-top: 1.5rem;
      }

      .btn {
        padding: 0.8rem 1.2rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ivory);
        cursor: pointer;
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: 0.3s;
      }

      .btn-primary {
        color: var(--accent);
        border-color: rgba(201, 185, 154, 0.35);
      }

      .btn:hover {
        background: rgba(201, 185, 154, 0.08);
      }

      .btn-cancel {
        display: none;
      }

      /* SKILLS */

      .skill-card {
        border: 1px solid var(--border);
        padding: 1.3rem;
        margin-bottom: 1rem;
        background: rgba(255, 255, 255, 0.02);
      }

      .skill-card:last-child {
        margin-bottom: 0;
      }

      .skill-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .skill-name {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
      }

      .skill-id {
        font-family: "Space Mono", monospace;
        color: var(--accent);
        font-size: 0.55rem;
      }

      .skill-info {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 0.5rem;
        font-size: 0.78rem;
      }

      .skill-info span:first-child {
        color: var(--accent);
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        text-transform: uppercase;
      }

      .skill-info span:last-child {
        color: var(--muted);
      }

      .level-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        margin-top: 0.8rem;
      }

      .level-fill {
        height: 100%;
        background: var(--accent);
      }

      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .action-btn {
        padding: 0.55rem 0.8rem;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        text-transform: uppercase;
        transition: 0.3s;
      }

      .edit-btn:hover {
        color: var(--accent);
        border-color: rgba(201, 185, 154, 0.4);
      }

      .delete-btn:hover {
        color: var(--danger);
        border-color: rgba(184, 120, 120, 0.4);
      }

      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
      }

      /* RESPONSIVE */

      @media (max-width: 900px) {
        .sidebar {
          width: 220px;
        }

        .main {
          margin-left: 220px;
          width: calc(100% - 220px);
          padding: 2rem;
        }

        .content-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .admin-wrapper {
          display: block;
        }

        .sidebar {
          position: relative;
          width: 100%;
          min-height: auto;
        }

        .sidebar-bottom {
          position: static;
          margin-top: 2rem;
        }

        .main {
          margin-left: 0;
          width: 100%;
          padding: 1.5rem;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.8rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="admin-wrapper">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <a href="index.html" class="logo"> Dilufar <span>Admin</span> </a>

        <div class="admin-label">Portfolio Management</div>

        <ul class="sidebar-menu">
          <li>
            <a href="index.html">
              <i class="fa-solid fa-chart-line"></i>
              Dashboard
            </a>
          </li>

          <li>
            <a href="about.html">
              <i class="fa-solid fa-user"></i>
              About
            </a>
          </li>

          <li>
            <a href="skills.html" class="active">
              <i class="fa-solid fa-code"></i>
              Skills
            </a>
          </li>

          <li>
            <a href="projects.html">
              <i class="fa-solid fa-folder-open"></i>
              Projects
            </a>
          </li>

          <li>
            <a href="contact.html">
              <i class="fa-solid fa-envelope"></i>
              Contact
            </a>
          </li>
        </ul>

        <div class="sidebar-bottom">
          <a href="../index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Portfolio
          </a>
        </div>
      </aside>

      <!-- MAIN -->

      <main class="main">
        <div class="topbar">
          <div>
            <div class="topbar-label">Admin Panel / Skills</div>

            <h1 class="topbar-title">Manage <em>Skills</em></h1>
          </div>
        </div>

        <div class="content-grid">
          <!-- FORM -->

          <section class="panel">
            <h2 class="panel-title" id="formTitle">Add Skill</h2>

            <form id="skillForm">
              <input type="hidden" id="editId" />

              <div class="form-group">
                <label class="panel-label"> Skill Name </label>

                <input
                  type="text"
                  id="skillName"
                  placeholder="JavaScript"
                  required
                />
              </div>

              <div class="form-group">
                <label class="panel-label"> Level </label>

                <input
                  type="number"
                  id="skillLevel"
                  placeholder="90"
                  min="1"
                  max="100"
                  required
                />
              </div>

              <div class="form-group">
                <label class="panel-label"> Category </label>

                <select id="skillCategory" required>
                  <option value="">Select category</option>

                  <option value="Frontend">Frontend</option>

                  <option value="Backend">Backend</option>

                  <option value="Tools">Tools</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="form-buttons">
                <button type="submit" class="btn btn-primary">
                  <i class="fa-solid fa-plus"></i>

                  <span id="submitText"> Add Skill </span>
                </button>

                <button type="button" class="btn btn-cancel" id="cancelBtn">
                  Cancel
                </button>
              </div>
            </form>
          </section>

          <!-- READ -->

          <section class="panel">
            <h2 class="panel-title">Skills List</h2>

            <div id="skillsList"></div>
          </section>
        </div>
      </main>
    </div>

    <script>
      /* ELEMENTS */

      const skillForm = document.getElementById("skillForm");

      const editId = document.getElementById("editId");

      const skillName = document.getElementById("skillName");

      const skillLevel = document.getElementById("skillLevel");

      const skillCategory = document.getElementById("skillCategory");

      const skillsList = document.getElementById("skillsList");

      const formTitle = document.getElementById("formTitle");

      const submitText = document.getElementById("submitText");

      const cancelBtn = document.getElementById("cancelBtn");

      /* GET */

      function getSkills() {
        const data = localStorage.getItem("skills");

        return data ? JSON.parse(data) : [];
      }

      /* SAVE */

      function saveSkills(data) {
        localStorage.setItem("skills", JSON.stringify(data));
      }

      /* READ */

      function renderSkills() {
        const skills = getSkills();

        skillsList.innerHTML = "";

        if (skills.length === 0) {
          skillsList.innerHTML = `
          <div class="empty">
            No skills available.
          </div>
        `;

          return;
        }

        skills.forEach((item) => {
          const card = document.createElement("div");

          card.className = "skill-card";

          card.innerHTML = `

          <div class="skill-header">

            <div class="skill-name">
              ${item.name}
            </div>

            <div class="skill-id">
              ID: ${item.id}
            </div>

          </div>

          <div class="skill-info">

            <span>Level</span>
            <span>${item.level}%</span>

            <span>Category</span>
            <span>${item.category}</span>

          </div>

          <div class="level-bar">

            <div
              class="level-fill"
              style="width: ${item.level}%"
            ></div>

          </div>

          <div class="actions">

            <button
              class="action-btn edit-btn"
              onclick="editSkill(${item.id})"
            >
              <i class="fa-solid fa-pen"></i>
              Edit
            </button>

            <button
              class="action-btn delete-btn"
              onclick="deleteSkill(${item.id})"
            >
              <i class="fa-solid fa-trash"></i>
              Delete
            </button>

          </div>

        `;

          skillsList.appendChild(card);
        });
      }

      /* CREATE + UPDATE */

      skillForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const skills = getSkills();

        const currentId = Number(editId.value);

        const data = {
          id: currentId ? currentId : Date.now(),

          name: skillName.value.trim(),

          level: Number(skillLevel.value),

          category: skillCategory.value,
        };

        /* UPDATE */

        if (currentId) {
          const index = skills.findIndex((item) => item.id === currentId);

          if (index !== -1) {
            skills[index] = data;
          }
        } else {

        /* CREATE */
          skills.push(data);
        }

        saveSkills(skills);

        renderSkills();

        resetForm();
      });

      /* EDIT */

      function editSkill(id) {
        const skills = getSkills();

        const item = skills.find((item) => item.id === id);

        if (!item) return;

        editId.value = item.id;

        skillName.value = item.name;

        skillLevel.value = item.level;

        skillCategory.value = item.category;

        formTitle.textContent = "Edit Skill";

        submitText.textContent = "Save Changes";

        cancelBtn.style.display = "block";

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      /* DELETE */

      function deleteSkill(id) {
        const confirmDelete = confirm(
          "Are you sure you want to delete this skill?",
        );

        if (!confirmDelete) return;

        const skills = getSkills();

        const filtered = skills.filter((item) => item.id !== id);

        saveSkills(filtered);

        renderSkills();

        if (Number(editId.value) === id) {
          resetForm();
        }
      }

      /* RESET */

      function resetForm() {
        skillForm.reset();

        editId.value = "";

        formTitle.textContent = "Add Skill";

        submitText.textContent = "Add Skill";

        cancelBtn.style.display = "none";
      }

      /* CANCEL */

      cancelBtn.addEventListener("click", resetForm);

      /* START */

      renderSkills();
    </script>
  </body>
</html>
